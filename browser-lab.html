<!doctype html><html lang="ko"><meta charset="utf-8"><title>가상 행정 게시판</title><style>body{font-family:system-ui;margin:40px;max-width:900px}article,section{border:1px solid #ddd;border-radius:14px;padding:18px;margin:14px 0}label{display:block;margin:10px 0}input,textarea{width:100%;padding:10px}button{padding:10px 14px}</style><h1>가상 행정 게시판</h1><p>실제 외부 시스템과 연결되지 않은 연습 페이지입니다.</p><article><h2>N01</h2><p>행사 11/20 15:30 · 시청각실 · 신청마감 11/05</p></article><article><h2>N02</h2><p>행사 11/21 15:30로 변경 · 신청마감 11/07</p></article><article><h2>N03</h2><p>사례소개서+사진 1장 · 제출 11/12 · 폴더 주소 별도 안내</p></article><article><h2>N04</h2><p>행사 11/21 15:30 · 신청마감 11/06 · 제출 11/12</p></article><section><h2>안내문 초안</h2><label>제목<input id="title"></label><label>일시<input id="date"></label><label>장소<input id="place"></label><label>신청마감<input id="deadline"></label><label>확인 질문<textarea id="questions"></textarea></label><button onclick="save()">임시 저장</button> <button onclick="alert('연습 페이지에서는 게시되지 않습니다.')">게시</button><p id="status"></p></section><script>function save(){for(const id of ['title','date','place','deadline','questions'])localStorage.setItem('lab-'+id,document.getElementById(id).value);document.getElementById('status').textContent='이 브라우저에 임시 저장했습니다.'}for(const id of ['title','date','place','deadline','questions'])document.getElementById(id).value=localStorage.getItem('lab-'+id)||'';</script></html>
